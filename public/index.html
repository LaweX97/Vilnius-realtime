<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vilnius - Sledování vozů</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vozy Vilnius">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        .vehicle-popup { font-size: 14px; }
        .vehicle-popup strong { color: #1e40af; font-size: 16px; }
    </style>
</head>
<body class="relative">

    <div class="absolute top-4 left-4 z-[1000]">
        <button onclick="toggleSearch()" class="bg-white p-3 rounded-full shadow-lg border border-gray-200 text-xl hover:bg-gray-50">🔍</button>
        <div id="searchPanel" class="hidden mt-2 bg-white p-4 rounded-lg shadow-lg border border-gray-200 w-64 sm:w-80">
            <h1 class="text-xl font-bold text-gray-800 mb-2">Vilnius realtime</h1>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="Ev. číslo vozu" class="border border-gray-300 rounded p-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="searchVehicle()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Najít</button>
            </div>
        </div>
    </div>

    <div id="filterMenu" class="absolute top-4 right-4 z-[1000] bg-white p-2 rounded-lg shadow-lg border border-gray-200 flex flex-col sm:flex-row gap-2 max-w-[140px] sm:max-w-none">
        <select id="filterTrakce" onchange="aplikovatFiltry()" class="bg-transparent border-b border-gray-200 pb-1 text-sm focus:outline-none truncate"><option value="vse">Všechny trakce</option></select>
        <select id="filterTyp" onchange="aplikovatFiltry()" class="bg-transparent border-b border-gray-200 pb-1 text-sm focus:outline-none truncate"><option value="vse">Všechny typy</option></select>
        <select id="filterLinka" onchange="aplikovatFiltry()" class="bg-transparent pb-1 text-sm focus:outline-none truncate"><option value="vse">Všechny linky</option></select>
    </div>

    <div id="searchResult" class="hidden absolute bottom-8 left-1/2 transform -translate-x-1/2 z-[1000] bg-white px-5 py-2 rounded-full shadow-lg border border-gray-200 text-sm font-bold whitespace-nowrap text-center"></div>

    <div id="map"></div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([54.6872, 25.2797], 13);
        let vsechnyVozy = []; 
        let vehicleMarkers = {};
        
        function toggleSearch() {
            const panel = document.getElementById('searchPanel');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                document.getElementById('searchInput').focus(); 
            } else {
                panel.classList.add('hidden');
            }
        }
        
        function naplnitFiltry(data) {
            const trakceSet = new Set();
            const typSet = new Set();
            const linkaSet = new Set();
            data.forEach(v => {
                if (v.trakce) trakceSet.add(v.trakce);
                if (v.typ) typSet.add(v.typ);
                if (v.linka) linkaSet.add(v.linka);
            });
            const updateSelect = (id, set, vychoziText) => {
                const select = document.getElementById(id);
                const currentVal = select.value;
                select.innerHTML = `<option value="vse">${vychoziText}</option>`;
                const polozky = Array.from(set).sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
                polozky.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item;
                    select.appendChild(opt);
                });
                if (set.has(currentVal)) select.value = currentVal;
            };
            updateSelect('filterTrakce', trakceSet, 'Všechny trakce');
            updateSelect('filterTyp', typSet, 'Všechny typy');
            updateSelect('filterLinka', linkaSet, 'Všechny linky');
        }
        
        function aplikovatFiltry() {
            const trakceVal = document.getElementById('filterTrakce').value;
            const typVal = document.getElementById('filterTyp').value;
            const linkaVal = document.getElementById('filterLinka').value;
            const filtrovano = vsechnyVozy.filter(v => {
                const matchTrakce = (trakceVal === 'vse' || v.trakce === trakceVal);
                const matchTyp = (typVal === 'vse' || v.typ === typVal);
                const matchLinka = (linkaVal === 'vse' || v.linka === linkaVal);
                return matchTrakce && matchTyp && matchLinka;
            });
            updateMap(filtrovano);
        }
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

        async function fetchVehicles() {
            const resultDiv = document.getElementById('searchResult');
            resultDiv.classList.remove('hidden');
            resultDiv.textContent = 'Stahuji data...';
            try {
                const response = await fetch('/api/vehicles');
                if (!response.ok) throw new Error(`Chyba serveru: ${response.status}`);
                const vehicles = await response.json();
                if (vehicles.error) throw new Error(vehicles.error);
                if (vehicles.length === 0) throw new Error('Seznam vozů je prázdný.');

                vsechnyVozy = vehicles;
                naplnitFiltry(vsechnyVozy);
                aplikovatFiltry();
                
                resultDiv.textContent = `✅ Úspěch: Zobrazeno ${vehicles.length} vozů`;
                resultDiv.style.color = "green";
                setTimeout(() => { resultDiv.classList.add('hidden'); resultDiv.style.color = "red"; }, 3000);
            } catch (error) {
                resultDiv.textContent = `❌ ${error.message}`;
                resultDiv.style.color = "red";
            }
        }

        function updateMap(vehicles) {
            const aktivniVozyId = new Set(vehicles.map(v => v.id));
            vehicles.forEach(v => {
                let urlTrakce = 'bus';
                if (v.trakce === 'Trolejbus') urlTrakce = 'trol';
                else if (v.trakce === 'Tramvaj') urlTrakce = 'tram'; 

                const urlTrasa = `https://www.stops.lt/vilnius/index.html#${urlTrakce}/${v.linka}/map`;
                const urlJR = `https://www.stops.lt/vilnius/index.html#${urlTrakce}/${v.linka}/a-b`;

                const popupContent = `
                    <b>Linka: ${v.linka}</b><br>
                    Trasa: ${v.trasa}<br>
                    Ev. č.: ${v.id}<br>
                    Typ: ${v.typ}<br>
                    Trakce: ${v.trakce}<br>
                    Rok výroby: ${v.rok}<br>
                    <div style="margin-top: 10px; display: flex; gap: 8px;">
                        <a href="${urlJR}" target="_blank" style="flex: 1; background: #3b82f6; color: white; text-align: center; padding: 4px 0; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 12px;">JŘ</a>
                        <a href="${urlTrasa}" target="_blank" style="flex: 1; background: #10b981; color: white; text-align: center; padding: 4px 0; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 12px;">Trasa</a>
                    </div>
                `;

                if (vehicleMarkers[v.id]) {
                    vehicleMarkers[v.id].setLatLng([v.lat, v.lng]);
                    vehicleMarkers[v.id].setPopupContent(popupContent);
                } else {
                    let barvaBodu = '#f59e0b';
                    const jeElektrobus = (v.trakce && v.trakce.toLowerCase().includes('elektrobus')) || (v.typ && v.typ.toLowerCase().includes('elektrobus'));
                    if (jeElektrobus) barvaBodu = '#22c55e';
                    else if (v.trakce === 'Tramvaj') barvaBodu = '#ef4444';
                    else if (v.trakce === 'Trolejbus') barvaBodu = '#3b82f6';

                    const marker = L.circleMarker([v.lat, v.lng], {
                        radius: 8, fillColor: barvaBodu, color: '#fff', weight: 2, fillOpacity: 0.9
                    }).addTo(map);
                    
                    marker.bindPopup(popupContent);
                    marker.vehicleData = v; 
                    vehicleMarkers[v.id] = marker;
                }
            });

            for (const id in vehicleMarkers) {
                if (!aktivniVozyId.has(id)) {
                    map.removeLayer(vehicleMarkers[id]);
                    delete vehicleMarkers[id];
                }
            }
        }

        function searchVehicle() {
            const id = document.getElementById('searchInput').value.trim();
            const resultDiv = document.getElementById('searchResult');
            document.getElementById('searchInput').blur(); 
            
            if (vehicleMarkers[id]) {
                const marker = vehicleMarkers[id];
                map.flyTo(marker.getLatLng(), 17, { duration: 1.5 });
                setTimeout(() => { marker.openPopup(); }, 1500);
                resultDiv.classList.add('hidden');
                document.getElementById('searchPanel').classList.add('hidden'); 
            } else {
                resultDiv.textContent = 'Vůz s tímto číslem není aktuálně na mapě.';
                resultDiv.classList.remove('hidden');
            }
        }

        fetchVehicles();
        setInterval(fetchVehicles, 10000);
    </script>
</body>
</html>
